<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🥀 VelvetLink · Discreet Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #020202;
            --panel-bg: rgba(8, 8, 8, 0.85);
            --gold: #d4af37;
            --gold-hover: #f0c040;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --border: rgba(255, 255, 255, 0.12);
            --border-gold: rgba(212, 175, 55, 0.5);
            --shadow: 0 20px 40px rgba(0,0,0,0.8);
            --radius-xl: 28px;
            --radius-md: 14px;
            --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 30% 20%, #1a1a1a 0%, #020202 80%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            width: 100%;
            max-width: 550px;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            padding: 2.2rem 1.8rem 2rem;
            animation: floatIn 0.8s ease-out;
        }
        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header .icon-row {
            font-size: 2.4rem; letter-spacing: 6px;
            filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.5));
            animation: pulse 2.8s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.04); opacity: 1; }
        }
        .header h1 {
            font-size: 2.2rem; font-weight: 800;
            background: linear-gradient(135deg, #f0c040, #d4af37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin: 0.2rem 0;
        }
        .header .sub { font-size: 0.85rem; color: var(--text-secondary); letter-spacing: 0.4px; }

        .search-box { display: flex; gap: 0.5rem; margin-bottom: 1.8rem; }
        .input-wrapper { flex: 1; position: relative; }
        .input-wrapper i {
            position: absolute; left: 1rem; top: 50%;
            transform: translateY(-50%); color: var(--gold); font-size: 0.9rem;
        }
        input {
            width: 100%; padding: 0.9rem 1rem 0.9rem 2.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 50px; font-size: 1rem; font-weight: 500;
            color: var(--text); outline: none; transition: all var(--transition);
            letter-spacing: 0.3px;
        }
        input::placeholder { color: #888; }
        input:focus { border-color: var(--gold); box-shadow: 0 0 18px rgba(212, 175, 55, 0.3); background: rgba(255,255,255,0.08); }
        .btn-generate {
            background: linear-gradient(135deg, #d4af37, #b8922e);
            border: none; color: #000; font-weight: 700; font-size: 0.95rem;
            padding: 0 1.4rem; height: 48px; border-radius: 50px;
            display: flex; align-items: center; gap: 0.3rem;
            cursor: pointer; transition: all var(--transition); white-space: nowrap;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }
        .btn-generate:hover { background: var(--gold-hover); box-shadow: 0 12px 24px rgba(212, 175, 55, 0.5); transform: translateY(-1px); }
        .btn-generate:active { transform: scale(0.96); }

        .quick-models { margin-bottom: 1.5rem; }
        .label-chips {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.2px;
            font-weight: 700; color: var(--gold); margin-bottom: 0.6rem;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .chips-container { display: flex; flex-wrap: wrap; gap: 0.5rem; }

        .model-chip {
            font-weight: 600; font-size: 0.8rem;
            padding: 0.5rem 1rem; border-radius: 50px; cursor: pointer;
            transition: all var(--transition); letter-spacing: 0.3px;
            border: 1px solid var(--border); background: rgba(255,255,255,0.03);
            color: var(--text); white-space: nowrap;
            animation: fadeUp 0.4s ease backwards;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .model-chip:hover {
            border-color: var(--gold); background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.2); transform: translateY(-2px);
        }
        .model-chip:active { transform: scale(0.95); }

        .direct-link-chip {
            border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05);
            color: var(--gold-hover);
        }
        .direct-link-chip:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.15); }

        .stripchat-profile { margin: 1.2rem 0 1.5rem; display: none; animation: fadeSlide 0.4s ease; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .profile-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 20px; padding: 1rem; display: flex; align-items: center; gap: 1rem;
        }
        .avatar-wrapper {
            width: 55px; height: 55px; border-radius: 50%; overflow: hidden;
            border: 2px solid var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { flex: 1; }
        .profile-name { font-weight: 700; font-size: 1rem; }
        .profile-site { font-size: 0.75rem; color: var(--gold); }
        .btn-stripchat {
            background: var(--gold); border: none; color: #000; font-weight: 700;
            padding: 0.5rem 1rem; border-radius: 50px; cursor: pointer; transition: all var(--transition);
        }
        .btn-stripchat:hover { background: var(--gold-hover); }

        #resultsContainer { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 0.8rem; }
        .link-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            border-radius: 16px; padding: 0.9rem 1.2rem; display: flex;
            align-items: center; justify-content: space-between; cursor: pointer;
            transition: all var(--transition); animation: fadeUp 0.4s ease backwards;
        }
        .link-card:hover { border-color: var(--gold); background: rgba(255,255,255,0.05); }
        .site-info { display: flex; align-items: center; gap: 0.8rem; font-weight: 600; }
        .btn-visit {
            background: transparent; border: 1px solid var(--border-gold); color: var(--gold);
            font-weight: 700; font-size: 0.85rem; padding: 0.5rem 1.2rem; border-radius: 50px;
            cursor: pointer; transition: all var(--transition); white-space: nowrap;
        }
        .btn-visit:hover { background: var(--gold); border-color: var(--gold); color: #000; }

        .empty-state { text-align: center; color: #888; padding: 1.5rem; }
        .footer-note { margin-top: 2rem; text-align: center; font-size: 0.7rem; color: #666; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 1.3rem; }
    </style>
</head>
<body>
    <main class="glass-panel">
        <div class="header">
            <div class="icon-row">🥀💋✨</div>
            <h1>VelvetLink</h1>
            <p class="sub">Discreet access · curated profiles</p>
        </div>

        <div class="search-box">
            <div class="input-wrapper">
                <i>🔍</i>
                <input type="text" id="modelNameInput" placeholder="Enter model name..." autocomplete="off" autofocus>
            </div>
            <button class="btn-generate" id="generateBtn"><span>✨</span> Find</button>
        </div>

        <!-- Sección Latina (orden A-Z) -->
        <div class="quick-models">
            <div class="label-chips"><span>🌶️</span> Latina</div>
            <div class="chips-container" id="latinaChips"></div>
        </div>

        <!-- Sección Other Models (orden A-Z) -->
        <div class="quick-models">
            <div class="label-chips"><span>🌑</span> Other Models</div>
            <div class="chips-container" id="otherChips"></div>
        </div>

        <!-- Enlaces directos -->
        <div class="quick-models">
            <div class="label-chips"><span>🔗</span> Direct links</div>
            <div class="chips-container" id="directChipsContainer"></div>
        </div>

        <div class="stripchat-profile" id="stripchatProfile">
            <div class="profile-card">
                <div class="avatar-wrapper"><img class="avatar-img" id="profileAvatar" src="" alt="Model"></div>
                <div class="profile-info">
                    <span class="profile-name" id="profileDisplayName"></span>
                    <span class="profile-site">🍑 Stripchat · live</span>
                    <button class="btn-stripchat" id="btnOpenStripchat">Visit ↗️</button>
                </div>
            </div>
        </div>

        <div id="resultsContainer">
            <div class="empty-state"><span style="font-size:2.2rem;">🥀</span><span>Type a name and press Find</span></div>
        </div>
        <div class="footer-note"><span>🔞</span> Adults only · 18+</div>
    </main>

    <script>
        (function() {
            const input = document.getElementById('modelNameInput');
            const generateBtn = document.getElementById('generateBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const stripchatProfile = document.getElementById('stripchatProfile');
            const profileAvatar = document.getElementById('profileAvatar');
            const profileDisplayName = document.getElementById('profileDisplayName');
            const btnOpenStripchat = document.getElementById('btnOpenStripchat');

            const avatarBaseUrls = [
                'https://img.stripchat.com/avatar/{model}',
                'https://edge.stripchat.com/avatar/{model}'
            ];
            const stripchatProfileUrl = 'https://stripchat.com/{model}';

            const sites = [
                { name: 'CumCams', icon: '🎥', urlPattern: 'https://es.cumcams.cc/performer/{model}' },
                { name: 'LiveCamRips', icon: '📹', urlPattern: 'https://livecamrips.to/search/{model}' },
                { name: 'CloudBate', icon: '☁️', urlPattern: 'https://www.cloudbate.com/models/{model}/' },
                { name: 'CamsMut', icon: '🔥', urlPattern: 'https://camsmut.com/tag/{model}' },
                { name: 'ArchiveBate', icon: '📼', urlPattern: 'https://archivebate.com/profile/{model}' },
                { name: 'ShowCamRips', icon: '🎬', urlPattern: 'https://www.showcamrips.com/model/en/{model}/' }
            ];

            // Lista de latinas (ordenada A-Z)
            const latinaModels = [
                'amor_smith_', 'anny_vittar', 'DearAbbiee', 'Esmeralda_Duarte',
                'HotSweetAngel', 'karla-bruni', 'karolvipxxx', 'KattalellaGomez',
                'LunaaRosse', 'MorenazaAcsa', 'riri_brunnete', 'sofierosse_',
                'steacy_19', '_lasuenscun', 'violeta_rosex'
            ].sort((a,b) => a.localeCompare(b, 'es', {sensitivity:'base'}));

            // Resto de modelos (ordenadas A-Z)
            const otherModels = [
                '18_salo', 'adri_miller', 'alice-blaker', 'anabelle_bluee10',
                'ava_blue', 'bellapaty', 'Brownie_With_Milk', 'celine_bell20',
                'Chloe_02g', 'Cristal-Jonnes', 'DAVID_VICTORIAA', 'Danteandviolete_cr',
                'Deisy_torres', 'fox_roxxan', 'Giviper1', 'ginaakemi',
                'hot69temptation_', 'hot_sophy', 'isabella_lovem', 'Ivelleee_',
                'Joha_ross92', 'kathdolly', 'Lizzie_Williams_', 'lolaslatary1',
                'Masked_SexyMelons', 'Mia_sweet80', '_mishelle', 'monicaflower',
                'myc_hot', 'nurse_becky', 'rave_connor', 'rose_berry',
                'SaharaArisa', 'Sarah-Office1', 'Sasha_0012', 'SexyDee025',
                'shainadavis', 'SinCityDoll', 'sofi_johansson', 'StormiRoseb',
                'the_titis_outdoors', 'xxxsexyamazon'
            ].sort((a,b) => a.localeCompare(b, 'es', {sensitivity:'base'}));

            const directLinks = [
                { label: 'Video 175361655', url: 'https://es.cumcams.cc/video/175361655/play' },
                { label: 'sol_and_andy', url: 'https://livecamrips.to/model/413943/sol_and_andy' },
                { label: 'myc_hot', url: 'https://livecamrips.to/model/7530/myc_hot' },
                { label: 'SinCityDoll', url: 'https://livecamrips.to/model/391731/SinCityDoll' },
                { label: 'SxyPrn Video', url: 'https://sxyprn.com/post/6a16236f557a0.html?asgtbndr=1' }
            ];

            function renderChips(containerId, models) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';
                models.forEach(name => {
                    const chip = document.createElement('button');
                    chip.className = 'model-chip';
                    chip.textContent = name;
                    chip.addEventListener('click', () => {
                        input.value = name;
                        handleGenerate();
                    });
                    container.appendChild(chip);
                });
            }

            function renderDirectLinks() {
                const container = document.getElementById('directChipsContainer');
                if (!container) return;
                container.innerHTML = '';
                directLinks.forEach(link => {
                    const chip = document.createElement('button');
                    chip.className = 'model-chip direct-link-chip';
                    chip.textContent = link.label;
                    chip.addEventListener('click', () => window.open(link.url, '_blank', 'noopener,noreferrer'));
                    container.appendChild(chip);
                });
            }

            // Inicializar chips
            renderChips('latinaChips', latinaModels);
            renderChips('otherChips', otherModels);
            renderDirectLinks();

            function sanitizeModelName(rawName) { return rawName.trim().replace(/\s+/g, ''); }

            function loadAvatar(cleanName) {
                profileDisplayName.textContent = cleanName;
                profileAvatar.src = '';
                let loaded = false;
                function tryNext(index) {
                    if (index >= avatarBaseUrls.length || loaded) {
                        if (!loaded) stripchatProfile.style.display = 'none';
                        return;
                    }
                    const url = avatarBaseUrls[index].replace('{model}', cleanName);
                    const testImg = new Image();
                    testImg.onload = () => {
                        if (!loaded) { loaded = true; profileAvatar.src = url; stripchatProfile.style.display = 'block'; }
                    };
                    testImg.onerror = () => tryNext(index + 1);
                    testImg.src = url;
                }
                tryNext(0);
            }

            function setupStripchatLink(cleanName) {
                const url = stripchatProfileUrl.replace('{model}', cleanName);
                btnOpenStripchat.onclick = (e) => {
                    e.stopPropagation();
                    window.open(url, '_blank', 'noopener,noreferrer');
                };
            }

            function renderLinks(cleanName) {
                resultsContainer.innerHTML = '';
                if (!cleanName) {
                    resultsContainer.innerHTML = '<div class="empty-state"><span style="font-size:2.2rem;">🥀</span><span>Name not valid</span></div>';
                    stripchatProfile.style.display = 'none';
                    return;
                }
                sites.forEach((site, index) => {
                    const finalUrl = site.urlPattern.replace('{model}', cleanName);
                    const card = document.createElement('div');
                    card.className = 'link-card';
                    card.style.animationDelay = `${index * 0.07}s`;
                    card.innerHTML = `
                        <div class="site-info"><span>${site.icon}</span><span>${site.name}</span></div>
                        <button class="btn-visit" data-url="${finalUrl}">Open ↗️</button>
                    `;
                    const visitBtn = card.querySelector('.btn-visit');
                    visitBtn.addEventListener('click', (e) => { e.stopPropagation(); window.open(finalUrl, '_blank', 'noopener,noreferrer'); });
                    card.addEventListener('click', () => window.open(finalUrl, '_blank', 'noopener,noreferrer'));
                    resultsContainer.appendChild(card);
                });
            }

            function handleGenerate() {
                const rawValue = input.value;
                const cleanName = sanitizeModelName(rawValue);
                if (!cleanName) {
                    resultsContainer.innerHTML = '<div class="empty-state"><span style="font-size:2.2rem;">🥀</span><span>Type a name and press Find</span></div>';
                    stripchatProfile.style.display = 'none';
                    return;
                }
                generateBtn.style.opacity = '0.7';
                generateBtn.style.pointerEvents = 'none';
                setTimeout(() => {
                    loadAvatar(cleanName);
                    setupStripchatLink(cleanName);
                    renderLinks(cleanName);
                    generateBtn.style.opacity = '1';
                    generateBtn.style.pointerEvents = 'auto';
                    // Scroll automático hasta los resultados
                    resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 200);
            }

            generateBtn.addEventListener('click', handleGenerate);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleGenerate(); });

            input.focus();
            stripchatProfile.style.display = 'none';
        })();
    </script>
</body>
</html>
