<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🥀 VelvetLink · Discreet Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0b0a0f;
            --glass-bg: rgba(18, 16, 25, 0.75);
            --glass-border: rgba(255, 80, 120, 0.2);
            --text-primary: #f5e7ec;
            --text-secondary: #b8a3ae;
            --accent-rose: #ff3b6e;
            --accent-gold: #d4a574;
            --accent-lilac: #b8a0d0;
            --accent-coral: #ff6f61;
            --accent-blue: #6fa8dc;
            --shadow-card: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 80, 120, 0.15);
            --shadow-hover: 0 20px 35px rgba(255, 60, 90, 0.25), 0 0 0 1px rgba(255, 80, 120, 0.4);
            --radius-xl: 32px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition-smooth: 0.28s cubic-bezier(0.23, 1, 0.32, 1);
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 30% 10%, #1a1124 0%, #0b0a0f 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 60, 90, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 60%, rgba(212, 167, 116, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(184, 160, 208, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .glass-panel {
            width: 100%;
            max-width: 530px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-card);
            padding: 2.5rem 1.8rem 2.2rem;
            animation: floatIn 0.8s ease-out;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            top: -30%; right: -30%;
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(255, 60, 90, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .header {
            position: relative; z-index: 1;
            text-align: center; margin-bottom: 2.2rem;
        }
        .header .icon-row {
            font-size: 2.6rem; letter-spacing: 6px;
            filter: drop-shadow(0 6px 14px rgba(255, 60, 90, 0.5));
            animation: sensualPulse 2.8s infinite ease-in-out;
        }
        @keyframes sensualPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .header h1 {
            font-size: 2.3rem; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffb3c6, #ff3b6e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
            filter: drop-shadow(0 0 15px rgba(255, 60, 90, 0.4));
        }
        .header .sub {
            font-size: 0.9rem; font-weight: 500;
            color: var(--text-secondary); letter-spacing: 0.4px; opacity: 0.9;
            display: flex; align-items: center; justify-content: center; gap: 0.3rem;
        }
        .search-box {
            display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
            align-items: center; position: relative; z-index: 1;
        }
        .input-wrapper { flex: 1; position: relative; }
        .input-wrapper i {
            position: absolute; left: 1rem; top: 50%;
            transform: translateY(-50%); color: #ff3b6e; font-size: 0.9rem;
            pointer-events: none;
        }
        input {
            width: 100%; padding: 0.95rem 1rem 0.95rem 2.5rem;
            background: rgba(20, 16, 26, 0.85);
            border: 1.5px solid rgba(255, 80, 120, 0.35);
            border-radius: 50px; font-size: 1rem; font-weight: 500;
            color: #f5e7ec; outline: none;
            transition: all var(--transition-smooth); letter-spacing: 0.3px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        input::placeholder { color: #7a6570; font-weight: 400; font-size: 0.95rem; }
        input:focus {
            border-color: var(--accent-rose);
            box-shadow: 0 0 22px rgba(255, 60, 90, 0.4), 0 0 0 3px rgba(255, 60, 90, 0.15);
            background: rgba(25, 20, 30, 0.9);
        }
        .btn-generate {
            background: linear-gradient(135deg, #ff3b6e, #c9184a);
            border: none; color: white; font-weight: 700; font-size: 0.95rem;
            padding: 0 1.4rem; height: 50px; border-radius: 50px;
            display: flex; align-items: center; gap: 0.3rem;
            cursor: pointer; box-shadow: 0 10px 22px -6px rgba(255, 60, 90, 0.5);
            transition: all var(--transition-smooth); letter-spacing: 0.5px;
            white-space: nowrap; backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative; overflow: hidden;
        }
        .btn-generate::after {
            content: ""; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-generate:hover::after { left: 100%; }
        .btn-generate:hover {
            background: linear-gradient(135deg, #ff5e7a, #da1e4f);
            box-shadow: 0 14px 28px -4px rgba(255, 60, 90, 0.7);
            transform: translateY(-2px);
        }
        .btn-generate:active { transform: scale(0.96); }
        .error-msg {
            color: #ffb3c6; font-size: 0.85rem; margin-top: 0.4rem;
            display: none; align-items: center; gap: 0.3rem;
            animation: shake 0.3s ease; position: relative; z-index: 1;
            background: rgba(255, 60, 90, 0.15);
            padding: 0.4rem 0.8rem; border-radius: 20px;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0);}
            25%{transform:translateX(-5px);}
            75%{transform:translateX(5px);}
        }
        .quick-models {
            position: relative; z-index: 1; margin-bottom: 1.3rem;
            display: flex; flex-direction: column; gap: 0.55rem;
        }
        .quick-models .label-chips {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px;
            font-weight: 700;
            display: flex; align-items: center; gap: 0.4rem;
            padding-left: 0.5rem;
            border-left: 3px solid transparent;
        }
        .section-latina .label-chips { color: #ff8a80; border-left-color: #ff5252; }
        .section-mom .label-chips { color: #d4a574; border-left-color: #d4a574; }
        .section-ebony .label-chips { color: #b8a0d0; border-left-color: #b388ff; }
        .section-couple .label-chips { color: #ff80ab; border-left-color: #ff4081; }
        .section-direct .label-chips { color: #6fa8dc; border-left-color: #448aff; }

        .chips-container { display: flex; flex-wrap: wrap; gap: 0.5rem; }

        .model-chip {
            font-weight: 600; font-size: 0.8rem;
            padding: 0.5rem 1rem; border-radius: 50px; cursor: pointer;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            transition: all var(--transition-smooth); letter-spacing: 0.3px;
            white-space: nowrap; display: flex; align-items: center; gap: 0.3rem;
            border: 1px solid transparent;
            background: rgba(25, 20, 30, 0.7);
            color: #e0d4db;
        }
        .model-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }
        .model-chip:active { transform: scale(0.95); }

        .chip-latina { border-color: rgba(255, 82, 82, 0.5); }
        .chip-latina:hover { background: rgba(255, 82, 82, 0.15); border-color: #ff5252; box-shadow: 0 6px 18px rgba(255, 82, 82, 0.25); }

        .chip-mom { border-color: rgba(212, 167, 116, 0.5); }
        .chip-mom:hover { background: rgba(212, 167, 116, 0.15); border-color: #d4a574; box-shadow: 0 6px 18px rgba(212, 167, 116, 0.2); }

        .chip-ebony { border-color: rgba(179, 136, 255, 0.5); }
        .chip-ebony:hover { background: rgba(179, 136, 255, 0.15); border-color: #b388ff; box-shadow: 0 6px 18px rgba(179, 136, 255, 0.2); }

        .chip-couple { border-color: rgba(255, 64, 129, 0.5); }
        .chip-couple:hover { background: rgba(255, 64, 129, 0.12); border-color: #ff4081; box-shadow: 0 6px 18px rgba(255, 64, 129, 0.2); }

        .model-chip.chip-green {
            background: rgba(0, 230, 118, 0.12);
            border-color: rgba(0, 200, 83, 0.5);
            color: #b9ffe0;
        }
        .model-chip.chip-green:hover {
            background: rgba(0, 230, 118, 0.2);
            border-color: #00c853;
            box-shadow: 0 6px 18px rgba(0, 200, 83, 0.25);
        }

        .model-chip-blue {
            background: rgba(68, 138, 255, 0.1);
            border: 1px solid rgba(68, 138, 255, 0.5);
            color: #d4e4ff;
            font-weight: 600; font-size: 0.8rem;
            padding: 0.5rem 1rem; border-radius: 50px; cursor: pointer;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            transition: all var(--transition-smooth); letter-spacing: 0.3px;
            white-space: nowrap; display: flex; align-items: center; gap: 0.3rem;
        }
        .model-chip-blue:hover {
            background: rgba(68, 138, 255, 0.2);
            border-color: #448aff;
            box-shadow: 0 6px 18px rgba(68, 138, 255, 0.3);
            transform: translateY(-2px);
        }
        .model-chip-blue:active {
            transform: scale(0.95);
            background: #448aff;
            color: white;
        }

        .stripchat-profile {
            position: relative; z-index: 1; margin: 1.2rem 0 1.5rem;
            display: none; animation: fadeSlide 0.4s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-card {
            background: rgba(25, 20, 30, 0.75);
            border: 1px solid rgba(255, 80, 120, 0.25);
            border-radius: var(--radius-lg); padding: 1rem;
            display: flex; align-items: center; gap: 1rem;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .avatar-wrapper {
            width: 65px; height: 65px; border-radius: 50%; overflow: hidden;
            flex-shrink: 0; background: #2a1a2a;
            border: 2px solid rgba(255, 80, 120, 0.5);
            box-shadow: 0 0 18px rgba(255, 60, 90, 0.3);
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .profile-info { flex: 1; display: flex; flex-direction: column; gap: 0.3rem; }
        .profile-name { font-weight: 700; font-size: 1.1rem; color: #f5e7ec; }
        .profile-site { font-size: 0.75rem; color: #ff8a80; display: flex; align-items: center; gap: 0.3rem; }
        .btn-stripchat {
            background: linear-gradient(135deg, #ff3b6e, #c9184a);
            border: none; color: white; font-weight: 700; font-size: 0.8rem;
            padding: 0.5rem 1.1rem; border-radius: 50px; cursor: pointer;
            display: flex; align-items: center; gap: 0.3rem; align-self: flex-start;
            box-shadow: 0 6px 16px rgba(255, 60, 90, 0.4);
            transition: all var(--transition-smooth); white-space: nowrap;
        }
        .btn-stripchat:hover { background: #ff5e7a; box-shadow: 0 8px 20px rgba(255, 60, 90, 0.6); }
        .btn-stripchat:active { transform: scale(0.95); }

        .results-container { display: flex; flex-direction: column; gap: 0.85rem; margin-top: 0.8rem; position: relative; z-index: 1; }
        .link-card {
            background: rgba(25, 20, 30, 0.7);
            border: 1px solid rgba(255, 80, 120, 0.2);
            border-radius: var(--radius-md); padding: 0.9rem 1.2rem;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            animation: cardRise 0.45s ease backwards;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all var(--transition-smooth);
        }
        @keyframes cardRise {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .link-card:hover {
            border-color: rgba(255, 80, 120, 0.5);
            background: rgba(30, 22, 35, 0.8);
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }
        .site-info { display: flex; align-items: center; gap: 0.8rem; font-weight: 600; color: #f5e7ec; }
        .site-icon { font-size: 1.4rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .btn-visit {
            background: rgba(255, 80, 120, 0.12);
            border: 1px solid rgba(255, 80, 120, 0.4);
            color: #ffb3c6; font-weight: 700; font-size: 0.85rem;
            padding: 0.55rem 1.2rem; border-radius: 50px;
            cursor: pointer; transition: all var(--transition-smooth);
            display: flex; align-items: center; gap: 0.3rem;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        .btn-visit:hover { background: #ff3b6e; border-color: #ff3b6e; color: white; }
        .btn-visit:active { transform: scale(0.94); }
        .empty-state { text-align: center; color: #7a6570; padding: 1.5rem 0.5rem; font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; opacity: 0.8; }
        .footer-note { margin-top: 2rem; text-align: center; font-size: 0.7rem; color: #5a4a54; letter-spacing: 0.6px; border-top: 1px solid rgba(255, 80, 120, 0.15); padding-top: 1.3rem; display: flex; align-items: center; justify-content: center; gap: 0.3rem; position: relative; z-index: 1; }
        @media (max-width: 380px) {
            .glass-panel { padding: 2rem 1.2rem 1.8rem; }
            .btn-generate { padding: 0 1.1rem; font-size: 0.9rem; }
            input { font-size: 0.9rem; }
            .model-chip, .model-chip-blue { font-size: 0.72rem; padding: 0.45rem 0.8rem; }
        }
    </style>
</head>
<body>
    <main class="glass-panel">
        <div class="header">
            <div class="icon-row">🥀💋✨</div>
            <h1>VelvetLink</h1>
            <p class="sub"><span>🔞</span> Discreet access · curated profiles</p>
        </div>

        <div class="search-box">
            <div class="input-wrapper">
                <i>🔍</i>
                <input type="text" id="modelNameInput" placeholder="Enter model name..." autocomplete="off" autofocus>
            </div>
            <button class="btn-generate" id="generateBtn"><span>✨</span> Find</button>
        </div>

        <div class="quick-models section-latina">
            <div class="label-chips"><span>🌶️</span> Latina</div>
            <div class="chips-container" id="latinaChips"></div>
        </div>
        <div class="quick-models section-mom">
            <div class="label-chips"><span>👩</span> Mom</div>
            <div class="chips-container" id="momChips"></div>
        </div>
        <div class="quick-models section-ebony">
            <div class="label-chips"><span>🌑</span> Ebony</div>
            <div class="chips-container" id="ebonyChips"></div>
        </div>
        <div class="quick-models section-couple">
            <div class="label-chips"><span>💑</span> Couple</div>
            <div class="chips-container" id="coupleChips"></div>
        </div>

        <div class="quick-models section-direct">
            <div class="label-chips"><span>🔗</span> Direct links</div>
            <div class="chips-container" id="directChipsContainer"></div>
        </div>

        <div class="error-msg" id="errorMsg"><span>⚠️</span> <span id="errorText"></span></div>

        <div class="stripchat-profile" id="stripchatProfile">
            <div class="profile-card">
                <div class="avatar-wrapper">
                    <img class="avatar-img" id="profileAvatar" src="" alt="Model avatar" loading="lazy">
                </div>
                <div class="profile-info">
                    <span class="profile-name" id="profileDisplayName"></span>
                    <span class="profile-site">🍑 Stripchat · live</span>
                    <button class="btn-stripchat" id="btnOpenStripchat"><span>Visit</span> ↗️</button>
                </div>
            </div>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="empty-state"><span style="font-size:2.2rem;">🥀</span><span>Type a name and press Find</span></div>
        </div>

        <div class="footer-note"><span>🔞</span> Adults only · 18+</div>
    </main>

    <script>
        (function() {
            const input = document.getElementById('modelNameInput');
            const generateBtn = document.getElementById('generateBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const directChipsContainer = document.getElementById('directChipsContainer');
            const stripchatProfile = document.getElementById('stripchatProfile');
            const profileAvatar = document.getElementById('profileAvatar');
            const profileDisplayName = document.getElementById('profileDisplayName');
            const btnOpenStripchat = document.getElementById('btnOpenStripchat');

            const avatarBaseUrls = [
                'https://img.stripchat.com/avatar/{model}',
                'https://edge.stripchat.com/avatar/{model}'
            ];
            const stripchatProfileUrl = 'https://stripchat.com/{model}';

            const sites = [
                { name: 'CumCams', icon: '🎥', urlPattern: 'https://es.cumcams.cc/performer/{model}' },
                { name: 'LiveCamRips', icon: '📹', urlPattern: 'https://livecamrips.to/search/{model}' },
                { name: 'CloudBate', icon: '☁️', urlPattern: 'https://www.cloudbate.com/models/{model}/' },
                { name: 'CamsMut', icon: '🔥', urlPattern: 'https://camsmut.com/tag/{model}' },
                { name: 'ArchiveBate', icon: '📼', urlPattern: 'https://archivebate.com/profile/{model}' },
                { name: 'ShowCamRips', icon: '🎬', urlPattern: 'https://www.showcamrips.com/model/en/{model}/' }
            ];

            const categories = {
                latina: ['LunaaRosse', 'amor_smith_', 'riri_brunnete', 'Esmeralda_Duarte', 'anny_vittar', 'violeta_rosex', '_lasuenscun', 'sofierosse_', 'steacy_19', 'karolvipxxx'],
                mom: ['lolaslatary1', 'Mia_sweet80', 'shainadavis'],
                ebony: ['SexyDee025', 'alice-blaker', 'xxxsexyamazon'],
                couple: ['rose_berry', 'sofi_johansson', 'fox_roxxan', 'anabelle_bluee10', 'Danteandviolete_cr', 'hot69temptation_', 'DAVID_VICTORIAA']
            };

            const greenModels = new Set([
                'rose_berry', 'violeta_rosex', '_lasuenscun', 'anabelle_bluee10',
                'sofi_johansson', 'sofierosse_', 'steacy_19', 'fox_roxxan',
                'Danteandviolete_cr', 'hot69temptation_', 'DAVID_VICTORIAA', 'karolvipxxx'
            ]);

            const directLinks = [
                { label: 'Video 175361655', url: 'https://es.cumcams.cc/video/175361655/play' },
                { label: 'sol_and_andy', url: 'https://livecamrips.to/model/413943/sol_and_andy' },
                { label: 'myc_hot', url: 'https://livecamrips.to/model/7530/myc_hot' },
                { label: 'SinCityDoll', url: 'https://livecamrips.to/model/391731/SinCityDoll' }
            ];

            function sanitizeModelName(rawName) {
                return rawName.trim().replace(/\s+/g, '');
            }

            function showError(message) {
                errorText.textContent = message;
                errorMsg.style.display = 'flex';
                errorMsg.style.animation = 'none';
                errorMsg.offsetHeight;
                errorMsg.style.animation = 'shake 0.3s ease';
            }
            function hideError() { errorMsg.style.display = 'none'; }

            function loadStripchatAvatar(cleanName) {
                profileDisplayName.textContent = cleanName;
                profileAvatar.src = '';
                let loaded = false;
                function tryNext(index) {
                    if (index >= avatarBaseUrls.length || loaded) {
                        if (!loaded) stripchatProfile.style.display = 'none';
                        return;
                    }
                    const url = avatarBaseUrls[index].replace('{model}', cleanName);
                    const testImg = new Image();
                    testImg.onload = function() {
                        if (!loaded) {
                            loaded = true;
                            profileAvatar.src = url;
                            stripchatProfile.style.display = 'block';
                        }
                    };
                    testImg.onerror = function() { tryNext(index + 1); };
                    testImg.src = url;
                }
                tryNext(0);
            }

            function setupStripchatLink(cleanName) {
                const url = stripchatProfileUrl.replace('{model}', cleanName);
                btnOpenStripchat.onclick = function(e) {
                    e.stopPropagation();
                    window.open(url, '_blank', 'noopener,noreferrer');
                };
            }

            function renderLinks(cleanName) {
                resultsContainer.innerHTML = '';
                if (!cleanName) {
                    resultsContainer.innerHTML = '<div class="empty-state"><span style="font-size:2.2rem;">🥀</span><span>Name not valid</span></div>';
                    stripchatProfile.style.display = 'none';
                    return;
                }
                sites.forEach((site, index) => {
                    const finalUrl = site.urlPattern.replace('{model}', cleanName);
                    const card = document.createElement('div');
                    card.className = 'link-card';
                    card.style.animationDelay = `${index * 0.07}s`;
                    card.innerHTML = `
                        <div class="site-info">
                            <span class="site-icon">${site.icon}</span>
                            <span>${site.name}</span>
                        </div>
                        <button class="btn-visit" data-url="${finalUrl}">Open ↗️</button>
                    `;
                    const visitBtn = card.querySelector('.btn-visit');
                    visitBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.open(visitBtn.getAttribute('data-url'), '_blank', 'noopener,noreferrer');
                    });
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.btn-visit')) return;
                        window.open(finalUrl, '_blank', 'noopener,noreferrer');
                    });
                    resultsContainer.appendChild(card);
                });
            }

            function handleGenerate() {
                const rawValue = input.value;
                const cleanName = sanitizeModelName(rawValue);
                if (!cleanName) {
                    showError('Please enter a valid name.');
                    resultsContainer.innerHTML = '<div class="empty-state"><span style="font-size:2.2rem;">🥀</span><span>Type a name and press Find</span></div>';
                    stripchatProfile.style.display = 'none';
                    return;
                }
                hideError();
                generateBtn.style.opacity = '0.7';
                generateBtn.style.pointerEvents = 'none';
                setTimeout(() => {
                    loadStripchatAvatar(cleanName);
                    setupStripchatLink(cleanName);
                    renderLinks(cleanName);
                    generateBtn.style.opacity = '1';
                    generateBtn.style.pointerEvents = 'auto';
                }, 160);
            }

            function selectModel(modelName) {
                input.value = modelName;
                handleGenerate();
            }

            function createChip(name, categoryClass, isGreen = false) {
                const chip = document.createElement('button');
                chip.className = `model-chip ${categoryClass}`;
                if (isGreen) chip.classList.add('chip-green');
                chip.textContent = name;
                chip.setAttribute('aria-label', `Find ${name}`);
                chip.addEventListener('click', () => selectModel(name));
                return chip;
            }

            function renderCategory(containerId, names, categoryClass) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';
                names.forEach(name => {
                    const isGreen = greenModels.has(name);
                    container.appendChild(createChip(name, categoryClass, isGreen));
                });
            }

            function renderDirectChips() {
                directChipsContainer.innerHTML = '';
                directLinks.forEach(link => {
                    const chip = document.createElement('button');
                    chip.className = 'model-chip-blue';
                    chip.textContent = link.label;
                    chip.setAttribute('aria-label', `Open ${link.label}`);
                    chip.addEventListener('click', () => window.open(link.url, '_blank', 'noopener,noreferrer'));
                    directChipsContainer.appendChild(chip);
                });
            }

            function initCategories() {
                renderCategory('latinaChips', categories.latina, 'chip-latina');
                renderCategory('momChips', categories.mom, 'chip-mom');
                renderCategory('ebonyChips', categories.ebony, 'chip-ebony');
                renderCategory('coupleChips', categories.couple, 'chip-couple');
            }

            generateBtn.addEventListener('click', handleGenerate);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleGenerate();
                }
                if (errorMsg.style.display === 'flex') hideError();
            });

            initCategories();
            renderDirectChips();
            input.focus();
            stripchatProfile.style.display = 'none';
            document.addEventListener('gesturestart', (e) => e.preventDefault());
        })();
    </script>
</body>
</html>
