<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>✨ Model Link Hub · Acceso rápido</title>
    <!-- Fuente elegante desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0b0a12;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-glow: rgba(255, 255, 255, 0.08);
            --text-primary: #f0eaea;
            --text-secondary: #b9b0c0;
            --accent: #e85d75;
            --accent-soft: #f28482;
            --accent-glow: rgba(232, 93, 117, 0.25);
            --glass-bg: rgba(20, 18, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-card: 0 20px 35px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 14px;
            --transition-smooth: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 30% 10%, #1f1a2e 0%, #0b0a12 75%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor principal con glassmorphism */
        .glass-panel {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card), 0 0 50px rgba(232, 93, 117, 0.08);
            padding: 2rem 1.5rem 1.8rem;
            transition: all var(--transition-smooth);
            animation: floatIn 0.7s ease-out;
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Encabezado */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header .icon-row {
            font-size: 2.6rem;
            margin-bottom: 0.4rem;
            letter-spacing: 4px;
            filter: drop-shadow(0 6px 14px rgba(232, 93, 117, 0.5));
            animation: softPulse 2.4s infinite ease-in-out;
        }
        @keyframes softPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.04);
                opacity: 1;
            }
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f9d3d0, #f28482);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }
        .header .sub {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        /* Buscador */
        .search-box {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.8rem;
            align-items: center;
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9c8a9e;
            font-size: 1rem;
            pointer-events: none;
        }
        input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            background: rgba(10, 8, 18, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            color: #f0eaea;
            outline: none;
            transition: all var(--transition-smooth);
            letter-spacing: 0.2px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        input::placeholder {
            color: #7a6e82;
            font-weight: 400;
            font-size: 0.95rem;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow), 0 0 0 2px rgba(232, 93, 117, 0.2);
            background: rgba(16, 13, 25, 0.8);
        }

        .btn-generate {
            background: linear-gradient(125deg, #e85d75, #c73e5d);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 0 1.5rem;
            height: 52px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            cursor: pointer;
            box-shadow: 0 10px 20px -8px rgba(232, 93, 117, 0.45);
            transition: all var(--transition-smooth);
            letter-spacing: 0.5px;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .btn-generate:hover {
            background: linear-gradient(125deg, #f27086, #d34664);
            box-shadow: 0 14px 26px -6px rgba(232, 93, 117, 0.6);
            transform: translateY(-1px);
        }
        .btn-generate:active {
            transform: scale(0.96);
            box-shadow: 0 5px 12px rgba(232, 93, 117, 0.5);
        }

        /* Mensaje de error */
        .error-msg {
            color: #ff9f9f;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            margin-bottom: 0.2rem;
            display: none;
            align-items: center;
            gap: 0.3rem;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        /* Resultados */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-top: 0.8rem;
        }
        .link-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: var(--radius-md);
            padding: 0.9rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: all 0.2s ease;
            animation: cardRise 0.5s ease backwards;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            cursor: default;
        }
        .link-card:hover {
            border-color: rgba(232, 93, 117, 0.4);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4), 0 0 15px rgba(232, 93, 117, 0.15);
        }
        @keyframes cardRise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .site-info {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-weight: 600;
            color: #ddd8e6;
            letter-spacing: 0.2px;
        }
        .site-icon {
            font-size: 1.4rem;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4));
        }
        .btn-visit {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f7e9ec;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            white-space: nowrap;
        }
        .btn-visit:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 6px 16px rgba(232, 93, 117, 0.5);
            transform: scale(1.03);
        }
        .btn-visit:active {
            transform: scale(0.94);
        }

        .empty-state {
            text-align: center;
            color: #9a8ba0;
            padding: 1.2rem 0.5rem;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            opacity: 0.8;
        }

        .footer-note {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.7rem;
            color: #5f5568;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        /* Responsive ajustes extra */
        @media (max-width: 380px) {
            .glass-panel {
                padding: 1.5rem 1rem 1.5rem;
            }
            .btn-generate {
                padding: 0 1.1rem;
                font-size: 0.9rem;
            }
            input {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <main class="glass-panel">
        <!-- Cabecera con animación sutil -->
        <div class="header">
            <div class="icon-row">🔮✨</div>
            <h1>Model Link Hub</h1>
            <p class="sub">Encuentra todos sus perfiles en un instante</p>
        </div>

        <!-- Buscador -->
        <div class="search-box">
            <div class="input-wrapper">
                <i>🔍</i>
                <input type="text" id="modelNameInput" placeholder="Nombre de la modelo..." autocomplete="off" autofocus>
            </div>
            <button class="btn-generate" id="generateBtn">
                <span>✨</span> Buscar
            </button>
        </div>
        <div class="error-msg" id="errorMsg">
            <span>⚠️</span> <span id="errorText"></span>
        </div>

        <!-- Resultados dinámicos -->
        <div class="results-container" id="resultsContainer">
            <div class="empty-state">
                <span style="font-size:2rem;">🌸</span>
                <span>Escribe un nombre y pulsa "Buscar"</span>
            </div>
        </div>

        <!-- Nota +18 -->
        <div class="footer-note">
            <span>🔞</span> Solo para adultos · Usa con responsabilidad
        </div>
    </main>

    <script>
        (function() {
            // Referencias a elementos del DOM
            const input = document.getElementById('modelNameInput');
            const generateBtn = document.getElementById('generateBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            // Definición de los sitios con sus patrones de URL y datos visuales
            const sites = [{
                name: 'CumCams',
                icon: '🎥',
                urlPattern: 'https://es.cumcams.cc/performer/{model}',
                colorHint: '#ff7b89'
            }, {
                name: 'CloudBate',
                icon: '☁️',
                urlPattern: 'https://www.cloudbate.com/models/{model}/',
                colorHint: '#b794f4'
            }, {
                name: 'CamsMut',
                icon: '🔥',
                urlPattern: 'https://camsmut.com/tag/{model}',
                colorHint: '#f6ad55'
            }, {
                name: 'ArchiveBate',
                icon: '📼',
                urlPattern: 'https://archivebate.com/profile/{model}',
                colorHint: '#68d391'
            }, {
                name: 'ShowCamRips',
                icon: '🎬',
                urlPattern: 'https://www.showcamrips.com/model/en/{model}/',
                colorHint: '#63b3ed'
            }];

            /**
             * Limpia el nombre ingresado: minúsculas, sin espacios, recorta.
             * @param {string} rawName
             * @returns {string} nombre procesado
             */
            function sanitizeModelName(rawName) {
                return rawName.trim().replace(/\s+/g, '').toLowerCase();
            }

            /**
             * Muestra mensaje de error con animación
             * @param {string} message
             */
            function showError(message) {
                errorText.textContent = message;
                errorMsg.style.display = 'flex';
                // Reinicia la animación de shake
                errorMsg.style.animation = 'none';
                errorMsg.offsetHeight; // reflow
                errorMsg.style.animation = 'shake 0.3s ease';
            }

            /** Oculta el mensaje de error */
            function hideError() {
                errorMsg.style.display = 'none';
            }

            /**
             * Construye y renderiza las tarjetas de enlace para un nombre de modelo dado.
             * @param {string} cleanName - nombre ya sanitizado
             */
            function renderLinks(cleanName) {
                // Limpiar contenedor
                resultsContainer.innerHTML = '';

                if (!cleanName) {
                    // Muestra estado vacío (no debería ocurrir si validamos antes)
                    resultsContainer.innerHTML = `
                                <div class="empty-state">
                                    <span style="font-size:2rem;">🌙</span>
                                    <span>Nombre no válido</span>
                                </div>`;
                    return;
                }

                // Crear tarjeta por cada sitio
                sites.forEach((site, index) => {
                    const finalUrl = site.urlPattern.replace('{model}', cleanName);

                    const card = document.createElement('div');
                    card.className = 'link-card';
                    card.style.animationDelay = `${index * 0.07}s`;

                    // Contenido de la tarjeta
                    card.innerHTML = `
                                <div class="site-info">
                                    <span class="site-icon">${site.icon}</span>
                                    <span>${site.name}</span>
                                </div>
                                <button class="btn-visit" data-url="${finalUrl}" aria-label="Abrir ${site.name}">
                                    <span>Ir</span> <span style="font-size:0.8rem;">↗️</span>
                                </button>
                            `;

                    // Evento para el botón "Ir" (abre en nueva pestaña)
                    const visitBtn = card.querySelector('.btn-visit');
                    visitBtn.addEventListener('click', (e) => {
                        e.stopPropagation(); // Evita comportamiento extraño en móvil
                        const url = visitBtn.getAttribute('data-url');
                        if (url) {
                            window.open(url, '_blank', 'noopener,noreferrer');
                        }
                    });

                    // También se puede hacer clic en la tarjeta completa (excepto botón) para abrir
                    card.addEventListener('click', (e) => {
                        // Si el clic fue directamente en el botón, no duplicar acción
                        if (e.target.closest('.btn-visit')) return;
                        window.open(finalUrl, '_blank', 'noopener,noreferrer');
                    });

                    resultsContainer.appendChild(card);
                });
            }

            /**
             * Maneja la acción de generar enlaces.
             */
            function handleGenerate() {
                const rawValue = input.value;
                const cleanName = sanitizeModelName(rawValue);

                if (!cleanName) {
                    showError('Por favor, introduce un nombre válido.');
                    // Mostrar también estado vacío
                    resultsContainer.innerHTML = `
                                <div class="empty-state">
                                    <span style="font-size:2rem;">🌸</span>
                                    <span>Escribe un nombre y pulsa "Buscar"</span>
                                </div>`;
                    return;
                }

                hideError();

                // Pequeño feedback visual en el botón (efecto de carga sutil)
                generateBtn.style.opacity = '0.7';
                generateBtn.style.pointerEvents = 'none';
                setTimeout(() => {
                    renderLinks(cleanName);
                    generateBtn.style.opacity = '1';
                    generateBtn.style.pointerEvents = 'auto';
                }, 180); // Mini delay para transición agradable
            }

            // Event listeners
            generateBtn.addEventListener('click', handleGenerate);

            // Permitir búsqueda con Enter
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleGenerate();
                }
                // Ocultar error cuando el usuario empieza a escribir
                if (errorMsg.style.display === 'flex') {
                    hideError();
                }
            });

            // Opcional: Si el usuario borra todo, podríamos mostrar el estado vacío, pero no es necesario.
            // Mantener foco inicial cómodo
            input.focus();

            // Prevenir zoom no deseado en iOS al hacer doble tap (opcional)
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            });
        })();
    </script>
</body>
</html>
