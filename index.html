
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORTNITE · Login</title>
    <!-- Fuentes y librerías -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Reset y base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            background: #0b0e1a;
            overflow: hidden;
            position: relative;
        }

        /* Fondo animado estilo tormenta / cielo de Fortnite */
        .storm-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #1a1f35 0%, #2a1f3d 30%, #1e2a4a 60%, #0f1a2e 100%);
            background-size: 400% 400%;
            animation: stormMove 18s ease-in-out infinite alternate;
        }

        @keyframes stormMove {
            0% {
                background-position: 0% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            100% {
                background-position: 0% 0%;
            }
        }

        /* Partículas (estilo polvo / estrellas) */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Contenedor principal del login */
        .login-container {
            position: relative;
            z-index: 10;
            background: rgba(10, 14, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 48px 48px 32px 32px;
            padding: 3rem 2.5rem 2.8rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.15) inset;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 215, 0, 0.25) inset;
        }

        /* Logo estilo Fortnite */
        .logo {
            font-family: 'Bangers', cursive;
            font-size: 3.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 165, 0, 0.4), 0 4px 0 #b8860b;
            margin-bottom: 0.2rem;
            position: relative;
            display: inline-block;
        }

        .logo span {
            display: inline-block;
            animation: glitch 2s infinite;
        }

        .logo .fortnite-icon {
            color: #ffd700;
            font-size: 2.8rem;
            margin-right: 6px;
            filter: drop-shadow(0 0 12px #ffa500);
        }

        @keyframes glitch {
            0%,
            100% {
                transform: skew(0deg);
            }
            5% {
                transform: skew(2deg) translateX(2px);
                text-shadow: 2px 0 #ff0055, -2px 0 #00ffff;
            }
            10% {
                transform: skew(-2deg) translateX(-2px);
                text-shadow: -2px 0 #ff0055, 2px 0 #00ffff;
            }
            15% {
                transform: skew(0deg);
            }
        }

        .sub-logo {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 6px;
            color: rgba(255, 215, 0, 0.7);
            text-transform: uppercase;
            margin-top: -6px;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Separador decorativo */
        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 0.5rem auto 1.8rem;
            border-radius: 10px;
        }

        /* Campos del formulario */
        .input-group {
            position: relative;
            margin-bottom: 1.8rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .input-group .icon {
            position: absolute;
            left: 16px;
            top: 42px;
            color: rgba(255, 215, 0, 0.6);
            font-size: 1rem;
            transition: color 0.2s;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            color: #fff;
            outline: none;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
        }

        .input-group input:focus {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.08), 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        .input-group input:focus+.icon,
        .input-group input:focus~.icon {
            color: #ffd700;
        }

        /* Botón principal */
        .btn-login {
            width: 100%;
            padding: 16px;
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #1a1f35;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #b86b00, 0 10px 30px rgba(255, 165, 0, 0.3);
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #b86b00, 0 20px 40px rgba(255, 165, 0, 0.5);
        }

        .btn-login:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b86b00;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .btn-login:hover::after {
            opacity: 1;
        }

        /* Enlaces adicionales (estilo Fortnite) */
        .extra-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
        }

        .extra-links a {
            color: rgba(255, 215, 0, 0.7);
            text-decoration: none;
            transition: color 0.2s, text-shadow 0.2s;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .extra-links a:hover {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* Mensaje de error falso */
        .fake-error {
            margin-top: 1.8rem;
            padding: 10px 16px;
            background: rgba(255, 0, 0, 0.08);
            border-left: 4px solid #ff4444;
            border-radius: 12px;
            color: #ff6b6b;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: none;
            backdrop-filter: blur(4px);
            animation: shake 0.4s ease;
        }

        .fake-error.show {
            display: block;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-12px);
            }
            40% {
                transform: translateX(12px);
            }
            60% {
                transform: translateX(-8px);
            }
            80% {
                transform: translateX(8px);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem 2rem;
                border-radius: 32px;
                margin: 1rem;
            }
            .logo {
                font-size: 2.8rem;
            }
            .btn-login {
                font-size: 1.5rem;
                padding: 14px;
            }
            .input-group input {
                padding: 12px 14px 12px 44px;
                font-size: 0.95rem;
            }
        }

        /* Efecto de "carga" en el botón */
        .btn-login.loading {
            pointer-events: none;
            opacity: 0.7;
            background: linear-gradient(135deg, #a67c00, #b86b00);
        }

        .btn-login.loading::before {
            content: '⚡';
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Firma sutil */
        .footer-credit {
            position: fixed;
            bottom: 18px;
            right: 24px;
            z-index: 20;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }
        .footer-credit a {
            color: rgba(255, 215, 0, 0.2);
            text-decoration: none;
            pointer-events: auto;
        }
        .footer-credit a:hover {
            color: rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Fondo tormenta -->
    <div class="storm-bg"></div>

    <!-- Canvas para partículas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Contenedor del login -->
    <div class="login-container" id="loginBox">

        <!-- Logo Fortnite -->
        <div class="logo">
            <i class="fas fa-solid fa-helmet-battle fortnite-icon"></i>
            <span>FORTNITE</span>
        </div>
        <div class="sub-logo">· BATTLE ROYALE ·</div>
        <div class="divider"></div>

        <!-- Formulario -->
        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="Ej: Guerrero_74" value="Ninja_23" />
                <i class="fas fa-user icon"></i>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" value="123456" />
                <i class="fas fa-lock icon"></i>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">¡Iniciar!</button>
        </form>

        <!-- Enlaces falsos -->
        <div class="extra-links">
            <a href="#" id="forgotLink"><i class="fas fa-question-circle"></i> ¿Olvidaste tu cuenta?</a>
            <a href="#" id="signupLink"><i class="fas fa-user-plus"></i> Registrarse</a>
        </div>

        <!-- Mensaje de error falso -->
        <div class="fake-error" id="fakeError">
            <i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>
            <span id="errorMsg">Acceso denegado. Verifica tus credenciales.</span>
        </div>
    </div>

    <!-- Crédito -->
    <div class="footer-credit">
        <a href="#" target="_blank">⚡ Falso Login · Estética Fortnite</a>
    </div>

    <script>
        (function() {
            'use strict';

            // --- Partículas ---
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 110;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2.5 + 0.8;
                    this.speedX = (Math.random() - 0.5) * 0.25;
                    this.speedY = (Math.random() - 0.5) * 0.25;
                    this.opacity = Math.random() * 0.6 + 0.2;
                    this.color = `hsla(${40 + Math.random() * 30}, 80%, 70%, ${this.opacity})`;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                        this.reset();
                        // Reposicionar en borde opuesto
                        if (this.x < 0) this.x = width;
                        if (this.x > width) this.x = 0;
                        if (this.y < 0) this.y = height;
                        if (this.y > height) this.y = 0;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(255, 215, 0, 0.3)';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // Inicializar partículas
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                // Dibujar algunas líneas entre partículas cercanas (efecto extra)
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.03)';
                ctx.lineWidth = 0.6;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 215, 0, ${0.03 * (1 - dist / 120)})`;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animateParticles);
            }
            animateParticles();

            // --- Lógica del login falso ---
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const fakeError = document.getElementById('fakeError');
            const errorMsg = document.getElementById('errorMsg');

            // Mensajes aleatorios de error
            const errorMessages = [
                '¡Acceso denegado! La tormenta te ha alcanzado.',
                'Credenciales incorrectas. ¡Intenta de nuevo, guerrero!',
                'No tienes pase de batalla. ¡Actualiza tu cuenta!',
                'Error de autenticación. ¿Olvidaste tu baile?',
                '¡Servidor ocupado! La tormenta se acerca...',
                'Cuenta bloqueada por exceso de victorias falsas.'
            ];

            function showError() {
                const randomMsg = errorMessages[Math.floor(Math.random() * errorMessages.length)];
                errorMsg.textContent = randomMsg;
                fakeError.classList.add('show');
                // Ocultar después de 4s
                clearTimeout(window.errorTimeout);
                window.errorTimeout = setTimeout(() => {
                    fakeError.classList.remove('show');
                }, 4000);
            }

            // Manejar envío
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Simular carga
                loginBtn.classList.add('loading');
                loginBtn.textContent = 'Conectando...';

                // Pequeño retraso para efecto
                setTimeout(() => {
                    loginBtn.classList.remove('loading');
                    loginBtn.textContent = '¡Iniciar!';
                    showError();

                    // Efecto de "sacudida" en el contenedor
                    const box = document.getElementById('loginBox');
                    box.style.animation = 'none';
                    setTimeout(() => {
                        box.style.animation = 'shake 0.4s ease';
                    }, 10);
                    setTimeout(() => {
                        box.style.animation = '';
                    }, 500);

                    // Limpiar campos opcional (divertido)
                    // usernameInput.value = '';
                    // passwordInput.value = '';
                }, 1200);
            });

            // Enlaces falsos (solo alertas)
            document.getElementById('forgotLink').addEventListener('click', function(e) {
                e.preventDefault();
                showError();
                errorMsg.textContent = '¡Recuperación de cuenta desactivada! (Modo demostración)';
                fakeError.classList.add('show');
                setTimeout(() => fakeError.classList.remove('show'), 3500);
            });

            document.getElementById('signupLink').addEventListener('click', function(e) {
                e.preventDefault();
                showError();
                errorMsg.textContent = '¡Registro cerrado por la tormenta! Vuelve más tarde.';
                fakeError.classList.add('show');
                setTimeout(() => fakeError.classList.remove('show'), 3500);
            });

            // Efecto al hacer clic en el logo (easter egg)
            document.querySelector('.logo').addEventListener('click', function() {
                this.style.transform = 'scale(1.1)';
                setTimeout(() => this.style.transform = '', 200);
                const msgs = ['¡VICTORY ROYALE!', '¡Saqueo épico!', '¡Tormenta despejada!', '¡Baila, baila!'];
                errorMsg.textContent = msgs[Math.floor(Math.random() * msgs.length)];
                fakeError.classList.add('show');
                fakeError.style.borderLeftColor = '#ffd700';
                fakeError.style.color = '#ffd700';
                setTimeout(() => {
                    fakeError.classList.remove('show');
                    fakeError.style.borderLeftColor = '#ff4444';
                    fakeError.style.color = '#ff6b6b';
                }, 2500);
            });

        })();
    </script>
</body>
</html>
