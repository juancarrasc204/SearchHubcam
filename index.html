                    const fallback = card._fallback;
                    if (!wrapper) return;
                    if (imagesVisible) {
                        wrapper.style.display = 'flex';
                        if (img && img.complete && img.naturalWidth > 0) {
                            img.style.display = 'block';
                            if (fallback) fallback.style.display = 'none';
                        } else if (img && img.complete && img.naturalWidth === 0) {
                            img.style.display = 'none';
                            if (fallback) fallback.style.display = 'block';
                        }
                    } else {
                        wrapper.style.display = 'none';
                    }
                });
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = tab.getAttribute('data-tab');
                    renderCurrentTab();
                    setTimeout(updateAllImagesVisibility, 50);
                });
            });

            toggleImagesBtn.addEventListener('click', () => {
                imagesVisible = !imagesVisible;
                toggleImagesBtn.textContent = imagesVisible ? '🙈' : '🖼️';
                updateAllImagesVisibility();
            });

            function applyTheme(theme) {
                if (theme === 'light') {
                    document.body.classList.add('light');
                    document.body.classList.remove('dark');
                } else {
                    document.body.classList.remove('light');
                    document.body.classList.add('dark');
                }
            }

            toggleThemeBtn.addEventListener('click', () => {
                const isLight = document.body.classList.contains('light');
                const newTheme = isLight ? 'dark' : 'light';
                applyTheme(newTheme);
                localStorage.setItem('velvetlink-theme', newTheme);
            });

            const savedTheme = localStorage.getItem('velvetlink-theme') || 'dark';
            applyTheme(savedTheme);

            // Extrae el nombre de usuario de una URL
            function extractModelName(rawValue) {
                const trimmed = rawValue.trim();
                // Si parece una URL (contiene http o comienza con www.)
                if (/^(https?:\/\/|www\.)/i.test(trimmed)) {
                    try {
                        const url = new URL(trimmed);
                        // Eliminar barra final si existe
                        let path = url.pathname.replace(/\/$/, '');
                        // Obtener el último segmento de la ruta
                        const segments = path.split('/').filter(s => s !== '');
                        if (segments.length > 0) {
                            return segments[segments.length - 1];
                        }
                    } catch (e) {
                        // Si falla el parseo, devolvemos el texto original
                        return trimmed;
                    }
                }
                // Si no es URL, se asume que ya es un nombre de modelo
                return trimmed;
            }

            function sanitizeModelName(rawName) {
                return rawName.replace(/\s+/g, '');
            }

            function loadAvatar(cleanName) {
                profileDisplayName.textContent = cleanName;
                profileAvatar.src = '';
                let loaded = false;
                function tryNext(index) {
                    if (index >= avatarBaseUrls.length || loaded) {
                        if (!loaded) stripchatProfile.style.display = 'none';
                        return;
                    }
                    const url = avatarBaseUrls[index].replace('{model}', cleanName);
                    const testImg = new Image();
                    testImg.onload = () => {
                        if (!loaded) { loaded = true; profileAvatar.src = url; stripchatProfile.style.display = 'block'; }
                    };
                    testImg.onerror = () => tryNext(index + 1);
                    testImg.src = url;
                }
                tryNext(0);
            }

            function setupStripchatLink(cleanName) {
                const url = stripchatProfileUrl.replace('{model}', cleanName);
                btnOpenStripchat.onclick = (e) => {
                    e.stopPropagation();
                    window.open(url, '_blank', 'noopener,noreferrer');
                };
            }

            function renderLinksResults(cleanName) {
                resultsContainer.innerHTML = '';
                if (!cleanName) {
                    resultsContainer.innerHTML = '<div class="empty-state"><span style="font-size:2.2rem;">🐺</span><span>Nombre no válido</span></div>';
                    stripchatProfile.style.display = 'none';
                    return;
                }
                sites.forEach((site, index) => {
                    const finalUrl = site.urlPattern.replace('{model}', cleanName);
                    const card = document.createElement('div');
                    card.className = 'link-card';
                    card.style.animationDelay = `${index * 0.07}s`;
                    card.innerHTML = `
                        <div class="site-info"><span>${site.icon}</span><span>${site.name}</span></div>
                        <button class="btn-visit">Open ↗️</button>
                    `;
                    card.addEventListener('click', () => window.open(finalUrl, '_blank', 'noopener,noreferrer'));
                    resultsContainer.appendChild(card);
                });
            }

            function handleGenerate() {
                const rawValue = input.value;
                // Extraer nombre desde posible enlace
                const extracted = extractModelName(rawValue);
                const cleanName = sanitizeModelName(extracted);
                if (!cleanName) {
                    resultsContainer.innerHTML = '<div class="empty-state"><span style="font-size:2.2rem;">🐺</span><span>Escribe un nombre y pulsa Track</span></div>';
                    stripchatProfile.style.display = 'none';
                    return;
                }
                generateBtn.style.opacity = '0.7';
                setTimeout(() => {
                    loadAvatar(cleanName);
                    setupStripchatLink(cleanName);
                    renderLinksResults(cleanName);
                    generateBtn.style.opacity = '1';
                    resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 200);
            }

            generateBtn.addEventListener('click', handleGenerate);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleGenerate(); });

            renderCurrentTab();
            input.focus();
            stripchatProfile.style.display = 'none';
        })();
    </script>
</body>
</html>
